services:
  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      LATENCY_MS: ${LATENCY_MS:-0}
    networks:
      - benchmark-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Framework apps ─────────────────────────────────────────────────────────
  nextjs-app:
    build:
      context: .
      dockerfile: packages/nextjs-app/Dockerfile
    ports:
      - "3001:3000"
    environment:
      API_URL: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nextjs-pages:
    build:
      context: .
      dockerfile: packages/nextjs-pages/Dockerfile
    ports:
      - "3002:3000"
    environment:
      API_URL: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  sveltekit:
    build:
      context: .
      dockerfile: packages/sveltekit/Dockerfile
    ports:
      - "3003:3000"
    environment:
      API_URL: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nuxt:
    build:
      context: .
      dockerfile: packages/nuxt/Dockerfile
    ports:
      - "3004:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  astro-vanilla:
    build:
      context: .
      dockerfile: packages/astro-vanilla/Dockerfile
    ports:
      - "3005:3000"
    networks:
      - benchmark-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  astro-solid:
    build:
      context: .
      dockerfile: packages/astro-solid/Dockerfile
    ports:
      - "3006:3000"
    networks:
      - benchmark-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qwik:
    build:
      context: .
      dockerfile: packages/qwik/Dockerfile
    ports:
      - "3007:3000"
    environment:
      VITE_API_URL: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  solidstart:
    build:
      context: .
      dockerfile: packages/solidstart/Dockerfile
    ports:
      - "3008:3000"
    environment:
      VITE_API_URL: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Benchmark runner ─────────────────────────────────────────────────────────
  benchmark:
    build:
      context: .
      dockerfile: packages/benchmark/Dockerfile
    environment:
      # API reachable via Docker service name inside benchmark-net
      API_BASE: http://api:3000
      # App base URLs inside Docker network (service names)
      APP_BASE_nextjs-app: http://nextjs-app:3000
      APP_BASE_nextjs-pages: http://nextjs-pages:3000
      APP_BASE_sveltekit: http://sveltekit:3000
      APP_BASE_nuxt: http://nuxt:3000
      APP_BASE_astro-vanilla: http://astro-vanilla:3000
      APP_BASE_astro-solid: http://astro-solid:3000
      APP_BASE_qwik: http://qwik:3000
      APP_BASE_solidstart: http://solidstart:3000
      RESULTS_DIR: /results
    volumes:
      - ./results:/results
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
      nextjs-app:
        condition: service_healthy
      nextjs-pages:
        condition: service_healthy
      sveltekit:
        condition: service_healthy
      nuxt:
        condition: service_healthy
      astro-vanilla:
        condition: service_healthy
      astro-solid:
        condition: service_healthy
      qwik:
        condition: service_healthy
      solidstart:
        condition: service_healthy

networks:
  benchmark-net:
    driver: bridge
