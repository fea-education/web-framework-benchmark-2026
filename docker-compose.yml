services:
  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      LATENCY_MS: ${LATENCY_MS:-0}
    networks:
      - benchmark-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Framework apps ─────────────────────────────────────────────────────────
  nextjs-app:
    build:
      context: .
      dockerfile: packages/nextjs-app/Dockerfile
    ports:
      - "3001:3000"
    environment:
      API_URL: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nextjs-pages:
    build:
      context: .
      dockerfile: packages/nextjs-pages/Dockerfile
    ports:
      - "3002:3000"
    environment:
      API_URL: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  sveltekit:
    build:
      context: .
      dockerfile: packages/sveltekit/Dockerfile
    ports:
      - "3003:3000"
    environment:
      API_URL: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nuxt:
    build:
      context: .
      dockerfile: packages/nuxt/Dockerfile
    ports:
      - "3004:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://api:3000
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  astro-vanilla:
    build:
      context: .
      dockerfile: packages/astro-vanilla/Dockerfile
    ports:
      - "3005:3000"
    networks:
      - benchmark-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  astro-solid:
    build:
      context: .
      dockerfile: packages/astro-solid/Dockerfile
    ports:
      - "3006:3000"
    networks:
      - benchmark-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qwik:
    build:
      context: .
      dockerfile: packages/qwik/Dockerfile
    ports:
      - "3007:3000"
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  solidstart:
    image: node:20-alpine
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
    command: >
      node -e "const http=require('http');const port=process.env.PORT||3008;
      http.createServer((req,res)=>{res.writeHead(200,{'Content-Type':'application/json'});
      res.end(JSON.stringify({status:'ok',stub:true,service:'solidstart'}))}).listen(port,()=>console.log('solidstart stub listening on port '+port))"
    networks:
      - benchmark-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3008/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Benchmark runner placeholder (will be implemented in slice 14) ───────────
  benchmark:
    image: node:20-alpine
    command: echo "benchmark placeholder"
    networks:
      - benchmark-net
    depends_on:
      api:
        condition: service_healthy

networks:
  benchmark-net:
    driver: bridge
