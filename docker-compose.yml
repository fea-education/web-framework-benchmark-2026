services:
  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      LATENCY_MS: ${LATENCY_MS:-0}
    networks:
      - benchmark-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Framework app stubs (will be replaced in Wave 4) ────────────────────────
  nextjs-app:
    image: node:20-alpine
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    command: >
      node -e "const http=require('http');const port=process.env.PORT||3001;
      http.createServer((req,res)=>{res.writeHead(200,{'Content-Type':'application/json'});
      res.end(JSON.stringify({status:'ok',stub:true,service:'nextjs-app'}))}).listen(port,()=>console.log('nextjs-app stub listening on port '+port))"
    networks:
      - benchmark-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  nextjs-pages:
